name: Build Delivery Branch

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: delivery-${{ github.ref }}
  cancel-in-progress: true

env:
  DELIVERY_BRANCH: delivery
  DELIVERY_DIR: ${{ runner.temp }}/engineai_robotics_delivery

jobs:
  build-delivery:
    name: Build and publish compiled delivery branch
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/engineai-robotics/engineai_robotics_env:latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build release binaries
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:${PATH}"
          ./build.sh -t release -j "$(nproc)"

      - name: Assemble delivery payload
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "${DELIVERY_DIR}"
          mkdir -p "${DELIVERY_DIR}/build/_install"

          # Compiled outputs only. Do not publish installed headers.
          rsync -a build/_install/bin "${DELIVERY_DIR}/build/_install/"
          rsync -a build/_install/lib "${DELIVERY_DIR}/build/_install/"
          if [ -d build/_install/share ]; then
            rsync -a build/_install/share "${DELIVERY_DIR}/build/_install/"
          fi

          # Runtime assets and operator-facing docs/scripts.
          rsync -a assets "${DELIVERY_DIR}/"
          rsync -a docs "${DELIVERY_DIR}/"
          rsync -a scripts "${DELIVERY_DIR}/"
          rsync -a tools "${DELIVERY_DIR}/"

          for file in LICENSE.txt README.md README_CN.md env.sh run.sh install.sh clear.sh; do
            if [ -f "${file}" ]; then
              cp -a "${file}" "${DELIVERY_DIR}/"
            fi
          done

          if [ -f POLICY_REPLACEMENT_T800.md ]; then
            cp -a POLICY_REPLACEMENT_T800.md "${DELIVERY_DIR}/"
          fi

          {
            printf '# EngineAI Native SDK Delivery\n\n'
            printf 'This branch is generated automatically by GitHub Actions.\n\n'
            printf -- '- Source repository: %s\n' "${GITHUB_REPOSITORY}"
            printf -- '- Source branch: %s\n' "${GITHUB_REF_NAME}"
            printf -- '- Source commit: %s\n' "${GITHUB_SHA}"
            printf -- '- Workflow run: %s/%s/actions/runs/%s\n' "${GITHUB_SERVER_URL}" "${GITHUB_REPOSITORY}" "${GITHUB_RUN_ID}"
            printf -- '- Build type: release\n\n'
            printf 'The delivery branch intentionally excludes C/C++ source trees such as\n'
            printf '`src/`, `core/`, `simulation/`, CMake files, and installed headers.\n'
          } > "${DELIVERY_DIR}/DELIVERY_MANIFEST.md"

          # Reduce binary size where possible. Ignore non-ELF files.
          find "${DELIVERY_DIR}/build/_install/bin" "${DELIVERY_DIR}/build/_install/lib" \
            -type f -perm -u+x -exec strip --strip-unneeded {} + 2>/dev/null || true

      - name: Verify source code is excluded
        shell: bash
        run: |
          set -euo pipefail
          cd "${DELIVERY_DIR}"

          forbidden_paths=(
            "./src"
            "./core"
            "./simulation"
            "./cmake"
            "./CMakeLists.txt"
            "./build.sh"
          )
          for path in "${forbidden_paths[@]}"; do
            if [ -e "${path}" ]; then
              echo "Forbidden delivery path found: ${path}" >&2
              exit 1
            fi
          done

          if find . -type f \( \
              -name '*.c' -o -name '*.cc' -o -name '*.cpp' -o -name '*.cxx' -o \
              -name '*.h' -o -name '*.hh' -o -name '*.hpp' -o -name '*.hxx' \
            \) -print -quit | grep -q .; then
            echo "C/C++ source or header files found in delivery payload:" >&2
            find . -type f \( \
              -name '*.c' -o -name '*.cc' -o -name '*.cpp' -o -name '*.cxx' -o \
              -name '*.h' -o -name '*.hh' -o -name '*.hpp' -o -name '*.hxx' \
            \) >&2
            exit 1
          fi

      - name: Publish delivery branch
        shell: bash
        run: |
          set -euo pipefail
          cd "${DELIVERY_DIR}"

          git init
          git checkout -b "${DELIVERY_BRANCH}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "delivery: ${GITHUB_SHA}"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin "HEAD:${DELIVERY_BRANCH}"
