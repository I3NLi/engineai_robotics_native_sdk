name: Build Delivery Branch

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: delivery-${{ github.ref }}
  cancel-in-progress: true

env:
  DELIVERY_BRANCH: delivery
  DELIVERY_DIR: /tmp/engineai_robotics_delivery

jobs:
  build-delivery:
    name: Build and publish compiled delivery branch
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/engineai-robotics/engineai_robotics_env:latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build release binaries
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:${PATH}"
          ./build.sh -t release -j "$(nproc)"
          ./scripts/build_mujoco.sh

      - name: Assemble delivery payload
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/package_delivery.sh "${DELIVERY_DIR}"

      - name: Publish delivery branch
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd "${DELIVERY_DIR}"

          git init
          git checkout -b "${DELIVERY_BRANCH}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "delivery: ${GITHUB_SHA}"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin "HEAD:${DELIVERY_BRANCH}"
